<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nooki Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell táctil — menú lateral claro, barra superior fija; tarjetas teñidas por estado; todo control mide 44–52 px para tocarse con el dedo. */
:root{
  color-scheme:light;
  --bg:#f1f1f1; --side:#ebebeb; --surface:#ffffff; --surface-2:#f7f7f7; --sunken:#e8e8e8;
  --hover:rgba(0,0,0,.05); --press:rgba(0,0,0,.09); --border:#e0e0e0; --border-2:#cbcbcb;
  --text:#1a1a1a; --text-2:#4a4a4a; --text-3:#6b6b6b;
  --grp-h:#242833;
  --primary:#2448c7; --primary-h:#1b379c; --on-primary:#ffffff;
  --accent:#2448c7; --accent-soft:#e8edfc; --on-accent:#ffffff; --focus:rgba(36,72,199,.3);
  /* estados: cinco familias de color bien separadas + gris */
  --ok:#067647; --ok-s:#dcfae6;
  --occ:#1d4ed8; --occ-s:#e0e9ff;
  --out:#c4320a; --out-s:#ffe9dc;
  --conf:#6927da; --conf-s:#efebff;
  --res:#6927da; --res-s:#f6f3ff;
  --clean:#a15c07; --clean-s:#fef3c7;
  --off:#5c5c63; --off-s:#ececef;
  --due:#b54708; --due-s:#fff1d6;
  --danger:#d92d20; --danger-s:#fee4e2;
  --on-s:#ffffff; --on-danger:#ffffff;
  --toast:#1a1a1a; --toast-fg:#f5f5f5;
  --scroll:rgba(0,0,0,.16); --scroll-h:rgba(0,0,0,.32);
  --sh-xs:0 1px 0 rgba(0,0,0,.05);
  --sh-sm:0 1px 3px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.02);
  --sh-lg:0 18px 44px -12px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.06);
  --sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-dw:cubic-bezier(.32,.72,0,1);
}
/* Modo oscuro: solo si el usuario lo activa desde el botón */
:root[data-ui="dark"]{
  --bg:#0f0f0f; --side:#141414; --surface:#1a1a1a; --surface-2:#1f1f1f; --sunken:#121212;
  --hover:rgba(255,255,255,.06); --press:rgba(255,255,255,.1); --border:#2c2c2c; --border-2:#3c3c3c;
  --text:#ededed; --text-2:#b0b0b0; --text-3:#8a8a8a;
  --grp-h:#dfe3ec;
  --primary:#8ba5f7; --primary-h:#a9bdfa; --on-primary:#0f0f0f;
  --accent:#8ba5f7; --accent-soft:#1b2342; --on-accent:#0f0f0f; --focus:rgba(139,165,247,.35);
  --ok:#47cd89; --ok-s:#0f2b1d; --occ:#84a9ff; --occ-s:#172446; --out:#ff8a5b; --out-s:#33190d;
  --conf:#b9a4ff; --conf-s:#241b42; --res:#b9a4ff; --res-s:#1d1830; --clean:#fdb022; --clean-s:#2f2410;
  --off:#a0a0a8; --off-s:#242427; --due:#fdb022; --due-s:#2f2410;
  --danger:#f97066; --danger-s:#3a1715; --on-s:#111111; --on-danger:#1a0c0b;
  --toast:#ededed; --toast-fg:#141414;
  --scroll:rgba(255,255,255,.16); --scroll-h:rgba(255,255,255,.3);
  --sh-xs:0 1px 0 rgba(0,0,0,.3); --sh-sm:0 1px 3px rgba(0,0,0,.45);
  --sh-lg:0 18px 44px -12px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tn{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
*{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
*:hover{scrollbar-color:var(--scroll-h) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-h);border:3px solid transparent;background-clip:padding-box}

/* status scopes */
.st-ok{--s:var(--ok);--ss:var(--ok-s)} .st-occ{--s:var(--occ);--ss:var(--occ-s)} .st-res{--s:var(--res);--ss:var(--res-s)}
.st-conf{--s:var(--conf);--ss:var(--conf-s)} .st-clean{--s:var(--clean);--ss:var(--clean-s)} .st-off{--s:var(--off);--ss:var(--off-s)}
.st-out{--s:var(--out);--ss:var(--out-s)} .st-dan{--s:var(--danger);--ss:var(--danger-s)} .st-due{--s:var(--due);--ss:var(--due-s)}
.st-all{--s:var(--text);--ss:var(--sunken)}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--ss);color:var(--s);font-size:13.5px;font-weight:600;white-space:nowrap;flex:none}
.pill .ic{width:16px;height:16px;stroke-width:2.2}
.pill.solid{background:var(--s);color:var(--on-s)}
.pill.st-res,.pill.st-res.solid{background:var(--surface);color:var(--s);border:1.5px dashed var(--s);padding:0 10px}

/* shell */
.app{display:grid;grid-template-columns:276px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;min-height:0;background:var(--side);border-right:1px solid var(--border);padding-block:14px;padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:12px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:block;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--text-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand > div{min-width:0}
.nav{flex:1;min-height:0;overflow-y:auto;display:grid;align-content:start;gap:3px;margin-right:-8px;padding-right:8px;scrollbar-color:transparent transparent}
.nav:hover,.nav:focus-within{scrollbar-color:var(--scroll) transparent}
.nav::-webkit-scrollbar{width:8px}
.nav::-webkit-scrollbar-thumb{background:transparent}
.nav:hover::-webkit-scrollbar-thumb{background:var(--scroll);background-clip:padding-box}
.ni{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--text-2);font-size:15px;font-weight:500;text-decoration:none;transition:background .15s,color .15s}
.ni:hover{background:var(--hover);color:var(--text)}
.ni:active{background:var(--press)}
.ni .ic{color:var(--text-3);transition:color .15s}
.ni.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:var(--sh-sm)}
.ni.on .ic{color:var(--accent)}
.ni > span:not(.bd){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .bd{margin-left:auto;font-size:13px;font-weight:700;color:var(--on-s);font-variant-numeric:tabular-nums}
.ni .bd:not(:empty){min-width:24px;height:24px;display:inline-grid;place-items:center;padding:0 7px;border-radius:999px;background:var(--conf)}
.grp{margin-top:14px}
.grp-h{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:34px;padding:0 12px;border:0;background:none;color:var(--text-3);font-size:13px;font-weight:600;border-radius:8px;text-transform:uppercase;letter-spacing:.05em}
.grp-h{color:var(--grp-h);font-weight:700}
.grp-h:hover{color:var(--grp-h);background:var(--hover)}
.grp-h .ic{width:16px;height:16px;transition:transform .25s var(--ease)}
.grp.closed .grp-h .ic{transform:rotate(-90deg)}
.grp-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s var(--ease)}
.grp.closed .grp-b{grid-template-rows:0fr}
.grp-b > div{overflow:hidden;display:grid;gap:3px;padding-top:2px}
.side-f{display:grid;gap:3px;border-top:1px solid var(--border);padding-top:12px;margin-top:10px}
.me{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 10px;border:0;border-radius:12px;background:none;text-align:left}
.me:hover{background:var(--hover)}
.me b{display:block;font-size:14.5px;font-weight:600}
.me small{display:block;font-size:13px;color:var(--text-3)}
.me .ic{margin-left:auto;color:var(--text-3)}
.av{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;flex:none}
.av .ic{width:18px;height:18px}
.av.sm{width:36px;height:36px;font-size:12.5px}
.av.lg{width:52px;height:52px;font-size:17px}
.side-scrim{display:none}

.main{position:relative;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:68px;padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px));background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--border)}
.crumbs{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;font-size:15px;color:var(--text-3);white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumbs .ic{width:16px;height:16px}
.search-trig{flex:0 1 440px;display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 14px;border:1px solid var(--border-2);border-radius:12px;background:var(--surface);color:var(--text-3);font-size:15px;box-shadow:var(--sh-xs);transition:border-color .15s,box-shadow .15s}
.search-trig:hover{border-color:var(--text-3);box-shadow:var(--sh-sm)}
.search-trig span{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font-family:var(--mono);font-size:12px;line-height:1;padding:4px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-3)}
.top-r{flex:1 1 0;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.tag{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:500;color:var(--text-2);white-space:nowrap}
button.tag{transition:border-color .15s,background .15s,color .15s}
button.tag:hover{border-color:var(--border-2)}
.tag b{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
#cajaBtn{background:var(--danger-s);border-color:color-mix(in srgb,var(--danger) 30%,transparent);color:var(--danger);font-weight:600}
#cajaBtn.on{background:var(--ok-s);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.tag .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.tag.on .dot{box-shadow:0 0 0 4px color-mix(in srgb,currentColor 18%,transparent)}
.only-m{display:none}

.view{max-width:1400px;margin-inline:auto;padding-block:28px 80px;padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px))}
.view.enter > *{animation:viewIn .4s var(--ease) both}
.view.enter > *:nth-child(2){animation-delay:.04s}
.view.enter > *:nth-child(3){animation-delay:.08s}
.view.enter > *:nth-child(n+4){animation-delay:.12s}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.sub{color:var(--text-2);font-size:15px;margin-top:6px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;color:var(--text-2);font-size:15px;font-weight:500;text-decoration:none;margin-bottom:2px}
.back:hover{color:var(--text)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-size:15px;font-weight:600;white-space:nowrap;text-decoration:none;box-shadow:var(--sh-xs);transition:background .15s,border-color .15s,transform .12s,box-shadow .15s,filter .15s}
.btn:hover{background:var(--surface-2);border-color:var(--text-3)}
.btn:active{transform:scale(.97)}
.btn-primary,.btn-ok,.btn-occ,.btn-out,.btn-danger{border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 1px 2px rgba(0,0,0,.18)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-h);border-color:transparent}
.btn-ok{background:var(--ok);color:var(--on-s)}
.btn-occ{background:var(--occ);color:var(--on-s)}
.btn-out{background:var(--out);color:var(--on-s)}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn-ok:hover,.btn-occ:hover,.btn-out:hover,.btn-danger:hover{border-color:transparent;filter:brightness(.92)}
.btn-ok:hover{background:var(--ok)} .btn-occ:hover{background:var(--occ)} .btn-out:hover{background:var(--out)} .btn-danger:hover{background:var(--danger)}
.btn-sm{min-height:40px;padding:0 14px;font-size:14.5px;border-radius:10px}
.btn-lg{min-height:54px;font-size:16px;border-radius:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-icon{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:12px;border:1px solid transparent;background:none;color:var(--text-2);transition:background .15s,color .15s}
.btn-icon:hover{background:var(--hover);color:var(--text)}
.btn-icon:active{background:var(--press)}
.btn-icon .ic{width:22px;height:22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-xs)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=time],input[type=tel],input:not([type]),textarea{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--border-2);background:var(--surface);font-size:15.5px;box-shadow:var(--sh-xs);transition:border-color .15s,box-shadow .15s}
textarea{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--focus)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
input[type=search]::-webkit-search-cancel-button{display:none}
.err-b{border-color:var(--danger)!important;box-shadow:0 0 0 3px var(--danger-s)!important}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0;align-content:start}
.field > label,.field > .lb{font-size:14px;font-weight:600;color:var(--text-2)}
.ferr{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--danger)}
.inp-ic{position:relative}
.inp-ic > .ic{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--text-3);pointer-events:none}
.inp-ic input{padding-left:44px}
.inp-pre{position:relative}
.inp-pre > span{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--text-3);font-size:15px;font-weight:500;pointer-events:none}
.inp-pre input{padding-left:40px;font-variant-numeric:tabular-nums;font-weight:600}
.sel{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:0 12px 0 14px;border-radius:12px;border:1px solid var(--border-2);background:var(--surface);font-size:15.5px;text-align:left;box-shadow:var(--sh-xs);transition:border-color .15s,box-shadow .15s}
.sel:hover{border-color:var(--text-3)}
.sel span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel.ph span{color:var(--text-3)}
.sel .ic{color:var(--text-3);transition:transform .2s var(--ease)}
.sel[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus)}
.sel[aria-expanded="true"] .ic{transform:rotate(180deg)}
.segm{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--sunken)}
.segm button{min-height:44px;border:0;border-radius:10px;background:none;color:var(--text-2);font-size:15px;font-weight:600;transition:background .2s,color .2s,box-shadow .2s}
.segm button[aria-checked="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--sh-sm)}
.stepper{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 4px;border-radius:12px;border:1px solid var(--border-2);background:var(--surface)}
.stepper button{width:44px;height:40px;border:0;border-radius:9px;background:var(--surface-2);color:var(--text);font-size:20px;font-weight:600;line-height:1}
.stepper button:hover{background:var(--hover)}
.stepper button:active{background:var(--press)}
.stepper output{font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums}
.warn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--clean-s);color:var(--clean);font-size:14.5px;font-weight:500}
.warn span{flex:1;min-width:160px}

/* panel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;text-align:left;min-width:0}
button.kpi{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s}
button.kpi:hover{border-color:color-mix(in srgb,var(--s) 40%,var(--surface));box-shadow:var(--sh-sm)}
button.kpi:active{transform:scale(.985)}
.kpi-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:var(--ss);color:var(--s);flex:none}
.kpi-ic .ic{width:24px;height:24px}
.kpi-t{display:grid;gap:3px;min-width:0;flex:1}
.kpi .k{font-size:14px;font-weight:500;color:var(--text-2)}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--text)}
.kpi .s{font-size:13.5px;color:var(--text-3)}
.kpi .btn{margin-top:8px;justify-self:start}
.meter{display:block;height:6px;border-radius:6px;background:var(--sunken);overflow:hidden;margin-block:6px 3px}
.meter i{display:block;height:100%;border-radius:6px;background:var(--s,var(--accent));transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.ftiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:14px}
.ft{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;min-height:70px;padding:10px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);text-align:left;box-shadow:var(--sh-xs);transition:border-color .18s,background .18s,box-shadow .18s,transform .12s}
.ft:hover{border-color:color-mix(in srgb,var(--s) 45%,var(--surface))}
.ft:active{transform:scale(.97)}
.ft-ic{grid-row:1/3;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--ss);color:var(--s);transition:background .18s,color .18s}
.ft-ic .ic{width:21px;height:21px}
.ft-n{font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--text)}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:26px}

.room{display:flex;flex-direction:column;min-height:186px;padding:0;border-radius:18px;border:1.5px solid color-mix(in srgb,var(--s) 28%,var(--surface));background:var(--surface);text-align:left;overflow:hidden;box-shadow:var(--sh-xs);transition:border-color .18s,box-shadow .18s,transform .18s;animation:fadeUp .42s var(--ease) both;animation-delay:calc(var(--i) * 14ms)}

/* popover */
.pop{position:fixed;z-index:95;min-width:220px;max-width:min(400px,calc(100vw - 16px));max-height:min(440px,calc(100vh - 24px));overflow-y:auto;padding:6px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-lg);animation:popIn .17s var(--ease) both}

.pop-form{display:grid;gap:12px;padding:10px;width:290px}

/* drawer */
.dw{position:fixed;inset:0;z-index:60;pointer-events:none}
.dw.open{pointer-events:auto}

.drawer{position:absolute;top:calc(10px + env(safe-area-inset-top, 0px));right:calc(10px + env(safe-area-inset-right, 0px));bottom:calc(10px + env(safe-area-inset-bottom, 0px));width:min(600px,calc(100vw - 20px));display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--sh-lg);transform:translateX(calc(100% + 24px));transition:transform .5s var(--ease-dw)}

.dw-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 12px 16px 20px;background:color-mix(in srgb,var(--s,var(--text)) 10%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--s,var(--text)) 18%,var(--surface))}
.dw-num{display:block;font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.1}

.dw-body > *{flex:none}
.guest{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.guest b{display:block;font-size:18px;font-weight:700}
.guest > div > span{display:block;color:var(--text-2);font-size:14.5px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--border-2);font-size:14px;font-weight:500;color:var(--text-2);margin-left:auto}
.chip .ic{width:17px;height:17px}
.stay{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.stay > div{background:var(--surface);padding:12px 14px;min-width:0}
.stay dt{font-size:13px;font-weight:500;color:var(--text-3)}
.stay dd{margin-top:3px;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.stay dd small{display:block;font-weight:400;font-size:13.5px;color:var(--text-2)}
.tabs{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:50px;padding:0 14px;border:0;background:none;color:var(--text-3);font-size:15.5px;font-weight:600;white-space:nowrap;transition:color .2s}
.tab:hover{color:var(--text-2)}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .c{margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--text-2);font-size:13px;font-variant-numeric:tabular-nums}

.tab-ind{position:absolute;left:0;bottom:0;height:3px;width:0;border-radius:3px 3px 0 0;background:var(--accent);transition:transform .38s var(--ease),width .38s var(--ease)}
.dw-tab{display:grid;gap:20px}

.blk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h3{font-size:16.5px;font-weight:700}
.lines{border:1px solid var(--border);border-radius:14px;overflow:hidden}

.rows{border:1px solid var(--border);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

button.row{width:100%;border-inline:0;border-bottom:0;background:none;text-align:left;transition:background .15s}

.hist small{display:block;font-size:13.5px;color:var(--text-3)}
.dw-f{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface-2)}

/* modal + palette */
.modal-wrap,.pal-wrap{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

.pal-list{max-height:min(440px,58vh);overflow-y:auto;padding:8px}

.pi{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 12px;border:0;border-radius:12px;background:none;text-align:left}

.pi.act .go{opacity:1}

.pal-foot{display:flex;gap:18px;padding:10px 16px;border-top:1px solid var(--border);background:var(--surface-2);font-size:13px;color:var(--text-3)}
.pal-foot span{display:inline-flex;align-items:center;gap:5px}

/* toast + tooltip */
#toasts{position:fixed;right:calc(18px + env(safe-area-inset-right, 0px));bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:100;display:grid;gap:10px;justify-items:end;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;max-width:min(420px,calc(100vw - 36px));padding:14px 18px;border-radius:14px;background:var(--toast);color:var(--toast-fg);font-size:15px;font-weight:500;box-shadow:var(--sh-lg);pointer-events:auto;animation:toastIn .45s cubic-bezier(.21,1.02,.73,1) both}

@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.97)}}
.tip{position:fixed;z-index:96;max-width:280px;padding:10px 12px;border-radius:12px;background:var(--toast);color:var(--toast-fg);font-size:14px;line-height:1.45;pointer-events:none;box-shadow:var(--sh-lg);opacity:0;transition:opacity .12s}

/* timeline */
.tl-tools{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipb{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border-2);background:var(--surface);color:var(--text-2);font-size:15px;font-weight:500;transition:background .2s,color .2s,border-color .2s}
.chipb:hover{color:var(--text);border-color:var(--text-3)}
.chipb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:500;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--ss);color:var(--s)}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--s)}
.legend .st-res i{background:transparent;border:1.5px dashed var(--s)}
.tl-card{overflow:hidden}
.tl-scroll{overflow:auto;max-height:72vh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tl{--cw:54px;--lw:196px;--sw:110px;position:relative;width:calc(var(--lw) + 31 * var(--cw) + var(--sw))}
.tl-head{position:sticky;top:0;z-index:5;display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.tl-corner{position:sticky;left:0;z-index:2;width:var(--lw);flex:none;display:flex;align-items:flex-end;padding:0 16px 12px;background:var(--surface);border-right:1px solid var(--border);font-size:13.5px;font-weight:600;color:var(--text-3)}
.tl-days{display:flex}
.tl-day{width:var(--cw);flex:none;padding:8px 0;text-align:center;font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.tl-day b{display:grid;place-items:center;width:32px;height:32px;margin:3px auto 0;border-radius:50%;font-size:15px;font-weight:600;color:var(--text);letter-spacing:0;font-variant-numeric:tabular-nums}
.tl-day.wk{background:var(--surface-2)}
.tl-day.today{color:var(--accent)}
.tl-day.today b{background:var(--accent);color:var(--on-accent)}
.tl-sumh{position:sticky;right:0;z-index:2;width:var(--sw);flex:none;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 16px 12px;background:var(--surface);border-left:1px solid var(--border);font-size:13.5px;font-weight:600;color:var(--text-3)}
.tl-body{position:relative}
.tl-grid{position:absolute;top:0;bottom:0;left:var(--lw);display:flex;pointer-events:none}
.tl-grid i{width:var(--cw);flex:none;border-right:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.tl-grid i.wk{background:var(--surface-2)}
.tl-now{position:absolute;top:0;bottom:0;z-index:2;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none}
.tl-row,.tl-grp{position:relative;display:flex}
.tl-row{height:56px;border-bottom:1px solid var(--border)}
.tl-grp{height:42px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.tl-label{position:sticky;left:0;z-index:3;width:var(--lw);flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);border-right:1px solid var(--border);font-size:15px;min-width:0}
.tl-label b{min-width:38px;font-weight:700;font-variant-numeric:tabular-nums}
.tl-label span{color:var(--s);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-label .d{width:10px;height:10px;border-radius:50%;background:var(--s);margin-left:auto;flex:none}
.tl-grp .tl-label{background:var(--surface-2);font-size:13.5px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.tl-cells{position:relative;width:calc(31 * var(--cw));flex:none}
.tl-sum{position:sticky;right:0;z-index:3;width:var(--sw);flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;background:var(--surface);border-left:1px solid var(--border);font-size:14.5px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
.tl-grp .tl-sum{background:var(--surface-2);color:var(--text)}
.bar{position:absolute;top:8px;height:40px;padding:0 10px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--s) 40%,transparent);background:var(--ss);color:var(--s);font-size:14px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform-origin:left;transition:box-shadow .15s,transform .15s;animation:barIn .5s var(--ease) both}
.bar.st-occ,.bar.st-out,.bar.st-conf{background:var(--s);color:var(--on-s);border-color:transparent}
.bar.st-res{border:1.5px dashed var(--s);background:var(--surface)}
.bar:hover{z-index:1;box-shadow:var(--sh-sm);transform:translateY(-1px)}
.bar:active{transform:scale(.98)}
@keyframes barIn{from{opacity:0;transform:scaleX(.5)}}
.soft .bar{animation:none}

/* nueva reserva */
.nr{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.nr-main{display:grid;gap:18px;min-width:0}

.rlist{display:grid;gap:12px}

.nr-side{position:sticky;top:88px}

.sum-li small{display:block;font-size:13.5px;color:var(--text-3);font-weight:400}

.sum-tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;border-top:1px solid var(--border)}

/* placeholder */
.phc{display:grid;gap:20px;padding:24px}
.ph-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ph-list li{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface-2);font-size:15px}

/* comprobante (papel siempre blanco) */
:root{--paper:#ffffff;--paper-ink:#141414;--paper-2:#5e5e5e;--paper-line:#e6e6e6}
/* ventas */
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.ptab{flex:none;min-height:50px;padding:0 16px;border:0;background:none;color:var(--text-3);font-size:15.5px;font-weight:600;box-shadow:inset 0 -3px 0 transparent;transition:color .2s,box-shadow .25s}
.ptab:hover{color:var(--text-2)}
.ptab[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.ptab .c{margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--text-2);font-size:13px;font-variant-numeric:tabular-nums}
.ptab[aria-selected="true"] .c{background:var(--accent-soft);color:var(--accent)}
.vtool{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.vtool .segm{flex:0 1 420px}
.vtool .sel{width:230px}
.vtool .tb-s{flex:1 1 240px}
.vlist{display:grid;gap:24px}
.vday{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.vday h2{font-size:17px;font-weight:700}
.vday span{font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums}
.vtable,.ttable{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface)}
.vhead,.vrow{display:grid;grid-template-columns:64px 150px minmax(0,1.7fr) 110px minmax(0,1fr) 120px 172px;gap:14px;align-items:center;padding:0 18px}
.vhead,.thead{min-height:44px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text-3);border-bottom:1px solid var(--border)}
.vrow{width:100%;min-height:68px;border:0;background:var(--surface);text-align:left;transition:background .15s;animation:fadeUp .35s var(--ease) both;animation-delay:calc(var(--i) * 12ms)}
.soft .vrow{animation:none}
.vrow + .vrow{border-top:1px solid var(--border)}
.vrow:hover{background:var(--hover)}
.vrow:active{background:var(--press)}
.vrow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow small{display:block;font-size:13px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc-d{font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-2)}
.vc-room{color:var(--text-2);font-size:14.5px}
.vc-m{display:flex;align-items:center;gap:7px;min-width:0;color:var(--text-2);font-size:14.5px}
.vc-m .ic{width:18px;height:18px;color:var(--text-3)}
.vc-a{text-align:right;font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums}
.vc-a.void{text-decoration:line-through;color:var(--text-3);font-weight:500}
.vc-s{justify-self:end}
.paper{position:relative;overflow:hidden;padding:20px;border-radius:14px;border:1px solid var(--border);background:var(--paper);color:var(--paper-ink);font-size:14px;box-shadow:var(--sh-sm)}
.pp-h{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--paper-line)}
.pp-h b{display:block;font-size:16px;font-weight:700}
.pp-h span{display:block;font-size:13px;color:var(--paper-2)}
.pp-box{flex:none;padding:8px 12px;border:1.5px solid var(--paper-ink);border-radius:8px;text-align:center;font-size:12.5px;line-height:1.45}
.pp-box b{font-size:13px}
.pp-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 16px;padding:14px 0;color:var(--paper-2)}
.pp-dl dd{color:var(--paper-ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.pp-l{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-block:1px solid var(--paper-line)}
.pp-l b{font-variant-numeric:tabular-nums;white-space:nowrap}
.pp-t{display:grid;gap:4px;max-width:240px;margin-left:auto;padding-top:12px;font-variant-numeric:tabular-nums}
.pp-t div{display:flex;justify-content:space-between;gap:16px}
.pp-t .t{margin-top:4px;padding-top:7px;border-top:1.5px solid var(--paper-ink);font-size:16px;font-weight:700}
.pp-void{position:absolute;top:46%;left:50%;translate:-50% -50%;rotate:-14deg;padding:4px 18px;border:4px solid rgba(217,45,32,.3);border-radius:12px;color:rgba(217,45,32,.3);font-size:46px;font-weight:800;letter-spacing:.12em;pointer-events:none}
.btn-dang-o{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--surface))}
.btn-dang-o:hover{background:var(--danger-s);border-color:var(--danger)}
/* caja */
.caja-hero{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(260px,340px);gap:22px;align-items:center;padding:26px;margin-bottom:18px;background:color-mix(in srgb,var(--s) 6%,var(--surface));border:1.5px solid color-mix(in srgb,var(--s) 28%,var(--surface))}
.caja-hero .hi{display:grid;place-items:center;width:60px;height:60px;border-radius:18px;background:var(--s);color:var(--on-s)}
.caja-hero .hi .ic{width:28px;height:28px}
.caja-hero h2{font-size:21px;font-weight:700}
.caja-hero p{max-width:54ch;margin-top:4px;color:var(--text-2)}
.caja-open{display:grid;gap:12px}
.cgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:18px}
.cblk{display:grid;gap:14px;padding:20px;margin-bottom:18px}
.cgrid .cblk{margin-bottom:0}
.mov{display:flex;align-items:center;gap:14px;min-height:66px;padding:10px 0;border-top:1px solid var(--border)}
.mov:first-child{border-top:0}
.mv-ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--ss);color:var(--s);flex:none}
.mov .grow{flex:1;min-width:0}
.mov b{display:block;font-weight:600}
.mov small{display:block;font-size:13.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .amt{color:var(--s);font-weight:700}
.mbar{display:grid;grid-template-columns:130px minmax(0,1fr) 112px;gap:14px;align-items:center;min-height:52px}
.mbar > span:first-child{font-weight:600}
.mbar small{display:block;font-size:13px;font-weight:400;color:var(--text-3)}
.trk{display:block;height:14px;border-radius:7px;background:var(--sunken);overflow:hidden}
.trk i{display:block;height:100%;border-radius:7px;background:var(--accent);transform-origin:left;animation:grow .8s var(--ease) both}
.mbar b{text-align:right;font-variant-numeric:tabular-nums}
.thead,.trow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.7fr) repeat(4,minmax(0,.8fr)) 158px;gap:14px;align-items:center;padding:0 18px}
.trow{min-height:66px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.thead + .trow{border-top:0}
.trow b{display:block;font-weight:600}
.trow small{display:block;font-size:13px;color:var(--text-3)}
.diffbox{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:0 18px;border-radius:14px;background:var(--ss);color:var(--s);font-weight:700;font-size:16.5px;transition:background .2s,color .2s}
.diffbox b{font-size:20px;font-variant-numeric:tabular-nums}
@media (max-width:1100px){
  .cgrid{grid-template-columns:minmax(0,1fr)}
  .vhead,.thead{display:none}
  .vrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"doc a" "cli s" "d m";row-gap:6px;padding:14px 18px}
  .vc-doc{grid-area:doc}.vc-a{grid-area:a}.vc-cli{grid-area:cli}.vc-s{grid-area:s}.vc-d{grid-area:d}.vc-m{grid-area:m;justify-self:end}.vc-room{display:none}
  .trow{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:8px;padding:14px 18px}
  .trow [data-l]::before{content:attr(data-l);display:block;font-size:12.5px;color:var(--text-3);font-weight:500}
}
@media (max-width:900px){.caja-hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.vtool .segm,.vtool .sel{flex:1 1 100%;width:100%}.mbar{grid-template-columns:96px minmax(0,1fr) 96px;gap:10px}.pp-h{flex-direction:column}}

button.lt-r:hover{background:var(--hover)}

.sw-row{display:flex;align-items:center;gap:12px;min-height:48px;color:var(--text-2)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dgrid .cblk{margin-bottom:0}
.vch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.vch-y{display:flex;flex-direction:column;justify-content:space-between;height:calc(var(--h) + 12px);margin-top:-6px;font-size:12px;line-height:12px;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums}
.vch-plot{position:relative;min-width:0}

.vch-x{display:grid;gap:2px;margin-top:8px;font-size:12px;color:var(--text-3);text-align:center;font-variant-numeric:tabular-nums}
.legend.mini{gap:6px;font-size:12.5px}

.link-s{display:inline-flex;align-items:center;min-height:40px;color:var(--accent);font-size:14.5px;font-weight:600;text-decoration:none}

.amb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}

.segc{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--occ);color:var(--on-s);font-size:12px;font-weight:700}

.mesa:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--s) 55%,var(--surface));box-shadow:0 6px 18px -8px color-mix(in srgb,var(--s) 45%,transparent)}

.ms-top{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-bottom:auto}

.lock-who{display:flex;align-items:center;gap:14px}

function tryPin(){

  if(LOCK.pin!==u.pin){LOCK.pin='';LOCK.err=true;var el=$('#lock');el.innerHTML='<div class="lock-card">'+lockHTML()+'</div>';var m=$('#lkMsg');if(m){m.textContent='PIN incorrecto. Inténtalo otra vez.';m.classList.add('bad');}return;}
  state.user=u;$('#lock').hidden=true;$('.app').inert=false;applyPerms();
  if(u.cargo==='Housekeeping')state.hkWho=u.name;
  toast('Hola, '+u.name,{icon:'user'});
  var want=location.hash.slice(1)||'panel';
  if(!can(want)||state.loginFirst){state.loginFirst=false;go(firstView());}else render();
}
document.addEventListener('keydown',function(e){
  var el=$('#lock');if(!el||el.hidden)return;
  if(e.key!=='Tab')e.stopPropagation();
  if(/^[0-9]$/.test(e.key)){e.preventDefault();pinKey(e.key);}
  else if(e.key==='Backspace'){e.preventDefault();pinKey('del');}
  else if(e.key==='Enter'&&LOCK.step==='pin'){e.preventDefault();pinKey('ok');}
  else if(e.key==='Escape'&&LOCK.step==='pin'){LOCK.step='who';LOCK.pin='';drawLock();}
},true);

    foot:'<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" id="pnGo">Guardar PIN</button>',
    onMount:function(w){$('#pnGo',w).onclick=function(){var a=$('#pnA',w).value,b=$('#pnB',w).value,er=$('#pnE',w);if(!/^\d{4}$/.test(a)){er.textContent='El PIN debe tener exactamente 4 números.';er.hidden=false;return;}if(a!==b){er.textContent='Los dos PIN no coinciden.';er.hidden=false;return;}e.pin=a;closeModal(true);toast('PIN de '+e.name+' actualizado',{icon:'check'});};}});

var SEASONS=[{n:'Fiestas Patrias',from:'2026-07-24',to:'2026-07-31',pct:20},{n:'Feriado largo · Todos los Santos',from:'2026-10-30',to:'2026-11-02',pct:15},{n:'Temporada baja',from:'2026-11-09',to:'2026-12-13',pct:-10},{n:'Navidad y Año Nuevo',from:'2026-12-23',to:'2027-01-02',pct:25}];
var WEEKEND={on:false,pct:10};
function seasonOf(d){return SEASONS.find(function(s){return fromIso(s.from)<=d&&d<=fromIso(s.to);});}
function nightPct(d){var s=seasonOf(d),p=s?s.pct:0;if(WEEKEND.on){var w=dt(d).getUTCDay();if(w===5||w===6)p+=WEEKEND.pct;}return p;}
function avgRate(base,ci,co){var n=Math.max(1,co-ci),t=0;for(var d=ci;d<ci+n;d++)t+=base*(1+nightPct(d)/100);return Math.round(t/n);}
function seasonLabel(ci,co){
  var n=Math.max(1,co-ci),m={},wk=0;for(var d=ci;d<ci+n;d++){var s=seasonOf(d);if(s)m[s.n]=(m[s.n]||0)+1;if(WEEKEND.on){var w=dt(d).getUTCDay();if(w===5||w===6)wk++;}}
  var parts=Object.keys(m).map(function(k){var s=SEASONS.find(function(x){return x.n===k;});return k+' '+(s.pct>0?'+':'')+s.pct+'%'+(m[k]<n?' · '+m[k]+' de '+n+' noches':'');});
  if(wk)parts.push('Fin de semana +'+WEEKEND.pct+'% · '+plural(wk,'noche','noches'));
  return parts.length?parts.join(' · '):'Regular';
}
function ssnSt(s){return s.pct<0?'ok':s.pct>=20?'dan':'out';}
function seasonsBody(){
  var now=function(s){var a=fromIso(s.from),b=fromIso(s.to);return b<TODAY?['Pasada','off']:a<=TODAY?['Activa ahora','ok']:['Próxima','conf'];};

  var cal='',start=TODAY,dows=['lun','mar','mié','jue','vie','sáb','dom'];

   nooki.mjs; SUNAT responde por webhooks a la nube y se sincroniza a la PC. */
CFG.amazonia=false;CFG.adel='cobro';CFG.autoPrint=true;

function nextDoc(kind,ref){

function rucValido(r){if(!/^(10|15|16|17|20)\d{9}$/.test(r))return false;var w=[5,4,3,2,7,6,5,4,3,2],s=0;for(var i=0;i<10;i++)s+=w[i]*+r[i];var d=11-s%11;d=d===10?0:d===11?1:d;return d===+r[10];}
function hashDe(p){var s=p.doc+'|'+p.amount+'|'+p.d+'|'+p.h,h=2166136261,o='';for(var k=0;k<28;k++){for(var i=0;i<s.length;i++){h^=s.charCodeAt(i)+k;h=Math.imul(h,16777619)>>>0;}o+='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'[h%64];}return o.slice(0,27)+'=';}
function qrSvg(seed){var n=21,c='',h=0;for(var i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
  var fin=function(x,y){return (x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);};
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){var on;if(fin(x,y)){var a=x>n-8?x-(n-7):x,b=y>n-8?y-(n-7):y;on=a===0||a===6||b===0||b===6||(a>1&&a<5&&b>1&&b<5);}else{h=(h*1103515245+12345)>>>0;on=(h>>16)&1;}if(on)c+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';}
  return '<svg class="qr" viewBox="-1 -1 23 23" aria-hidden="true"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/><g fill="#111">'+c+'</g></svg>';}

/* Envío a SUNAT a través de Nooki. Sin internet, el comprobante queda guardado y sale solo cuando vuelve. */
function emitirSunat(p){
  if(p.kind==='Nota de venta'){p.sunat='interno';return;}
  p.sunat='pendiente';p.hash=p.hash||hashDe(p);
  if(!NOOKI.online){p.offline=true;return;}
  p.offline=false;
  setTimeout(function(){if(p.sunat==='pendiente'&&NOOKI.online){p.sunat='aceptado';NOOKI.lastOk=nowHM();toast('SUNAT aceptó la '+p.kind.toLowerCase()+' '+p.doc);refresh();}},2800);

function repF(k){state.repF=state.repF||{};var f=state.repF[k];if(!f){f=state.repF[k]={per:REPDEF[k],a:TODAY-6,b:TODAY,x:{}};}return f;}
function repRange(k){var f=repF(k);if(!f.per)return null;

/* ================= v11: agregar, editar y quitar habitaciones y tipos ================= */
/* Ajustes → Habitaciones y tarifas (ya pide la clave de administrador). Se pueden agregar
   habitaciones una por una o varias seguidas (por ejemplo, todo un piso nuevo: 501 a 510),
   cambiarles el tipo o el piso, quitarlas de la venta o eliminarlas si nunca tuvieron
   reservas. También se agregan tipos nuevos (Suite, Familiar…) con su tarifa y capacidad. */
function ordenarRooms(){ROOMS.sort(function(a,b){var fa=a.f||99,fb=b.f||99;return (fa-fb)||String(a.n).localeCompare(String(b.n),'es',{numeric:true});});}
function pisos(){var f=[];ROOMS.forEach(function(r){if(f.indexOf(r.f)<0)f.push(r.f);});return f.sort(function(a,b){return (a||99)-(b||99);});}
function pisoTxt(f){return f?'Piso '+f:'Áreas comunes';}
function resDe(n){return RES.filter(function(r){return r.room===n;});}
function resVivas(n){return RES.filter(function(r){return r.room===n&&['ocupado','reservado','confirmado'].indexOf(r.state)>-1&&r.co>=TODAY;});}
function tiposSel(){return TYPE_ORDER.map(function(t){return {v:t,l:TYPES[t].n,hint:money0(TYPES[t].rate)};});}

function tarifasBody(){
  var tipos=lt('minmax(0,1.6fr) 110px 110px 170px 52px',['Tipo','>Habitaciones','>Personas','>Tarifa por noche',''],TYPE_ORDER.map(function(t){var T=TYPES[t],n=ROOMS.filter(function(r){return r.t===t;}).length;
    return '<div class="lt-r">'+cell('Tipo','<b>'+esc(T.n)+'</b>','wide')+cell('Habitaciones','<span class="tn">'+n+'</span>','r')+cell('Personas','<span class="tn">'+T.cap+'</span>','r')+
      cell('Tarifa','<span class="inp-pre"><span>S/</span><input type="number" data-rate="'+t+'" value="'+T.rate+'" min="0" step="5" aria-label="Tarifa de '+esc(T.n)+'"></span>','r')+

  var hab=pisos().map(function(f){var list=ROOMS.filter(function(r){return r.f===f;});
    return '<div class="hb-piso"><div class="hb-ph"><b>'+pisoTxt(f)+'</b><span class="hint">'+plural(list.length,'habitación','habitaciones')+'</span></div><div class="hb-grid">'+list.map(function(r){
      var viva=activeRes(r.n);

    '<div class="blk-h2" style="margin-top:10px"><h3>Habitaciones <span class="hint">· '+ROOMS.length+' en total'+', '+vend+' a la venta</span></h3><button type="button" class="btn btn-sm btn-primary" data-act="hab-add">'+ic('plus')+'Agregar habitación</button></div>'+
    '<p class="hint" style="margin-top:0">Toca una habitación para cambiarle el número, el tipo o el piso. El interruptor la saca de la venta (mantenimiento, remodelación) sin borrarla.</p>'+hab;

function habModal(rm){
  var nueva=!rm,f={n:rm?rm.n:'',t:rm?rm.t:'MQ',f:rm?rm.f:(pisos().filter(function(x){return x;}).slice(-1)[0]||1),venta:rm?!rm.off:true,varias:false,hasta:''};
  var conRes=rm?resDe(rm.n).length:0;

  var body='<div class="g2">'+
    '<div class="field"><label for="hbN">'+(nueva?'Número':'Número')+'</label><input id="hbN" value="'+esc(f.n)+'" maxlength="8" autocomplete="off" placeholder="Ej. 501"'+(conRes?' disabled':'')+'>'+(conRes?'<span class="hint">No se cambia porque ya tiene reservas.</span>':'')+'</div>'+

    (nueva?'':'<span></span>')+
    '<div class="field"><span class="lb">Tipo</span>'+sel('hb-t',TYPES[f.t].n)+'</div>'+
    '<div class="field"><label for="hbF">Piso</label><input id="hbF" type="number" min="0" max="30" value="'+f.f+'"><span class="hint">0 = áreas comunes (auditorio, salones).</span></div></div>'+
    '<label class="rsw" style="margin-top:6px"><span><b>A la venta</b><small>Aparece en el panel, en el timeline y al crear reservas</small></span>'+sw(f.venta,'hb-venta','','A la venta')+'</label>'+
    '<p class="ferr" id="hbE" hidden></p>';
  var foot=(nueva?'':'<button class="btn btn-dang-o" id="hbDel" style="margin-right:auto">'+ic('trash')+'Eliminar</button>')+'<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" id="hbGo">'+ic('check')+(nueva?'Agregar':'Guardar')+'</button>';
  openModal({title:nueva?'Agregar habitación':'Habitación '+rname(rm.n),width:540,body:body,foot:foot,onMount:function(w){
    var err=function(m){var e=$('#hbE',w);e.textContent=m;e.hidden=false;};
    w.addEventListener('click',function(e){var s=e.target.closest('[data-act="hb-venta"]');if(!s)return;e.stopPropagation();f.venta=!f.venta;s.setAttribute('aria-checked',String(f.venta));},true);
    $('#hbGo',w).onclick=function(){
      var n=$('#hbN',w).value.trim().toUpperCase(),piso=parseInt($('#hbF',w).value,10),h=nueva?$('#hbH',w).value.trim():'';
      if(!n)return err('Escribe el número de la habitación.');
      if(!/^[0-9A-Z-]{1,8}$/.test(n))return err('Usa solo números o letras, sin espacios (ej. 501 o 5A).');
      if(isNaN(piso)||piso<0||piso>30)return err('El piso debe ser un número de 0 a 30.');
      var nums=[n];

        toast(nums.length===1?'Habitación '+n+' agregada · '+TYPES[f.t].n+' · '+pisoTxt(piso):nums.length+' habitaciones agregadas ('+nums[0]+' a '+nums[nums.length-1]+') · '+TYPES[f.t].n+' · '+pisoTxt(piso),{icon:'check'});render({soft:true});return;}

    foot:(nuevo||t==='AU'?'':'<button class="btn btn-dang-o" id="tpDel" style="margin-right:auto">'+ic('trash')+'Eliminar</button>')+'<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" id="tpGo">'+ic('check')+(nuevo?'Agregar tipo':'Guardar')+'</button>',
    onMount:function(w){var err=function(m){var e=$('#tpE',w);e.textContent=m;e.hidden=false;};
      $('#tpGo',w).onclick=function(){var nm=$('#tpN',w).value.trim(),c=parseInt($('#tpC',w).value,10),b=parseInt($('#tpB',w).value,10),r=parseFloat($('#tpR',w).value);
        if(nm.length<3)return err('Escribe el nombre del tipo (ej. Suite familiar).');
        if(TYPE_ORDER.some(function(k){return k!==t&&norm(TYPES[k].n)===norm(nm);}))return err('Ya existe un tipo con ese nombre.');
        if(!(c>=1))return err('Indica cuántas personas entran.');if(isNaN(b)||b<0)return err('Indica cuántas camas tiene.');if(!(r>=0))return err('Indica la tarifa por noche.');
        if(nuevo){var k='X'+(TYPE_ORDER.length+1)+Date.now().toString(36).slice(-3);TYPES[k]={n:nm,rate:r,beds:b,cap:c};var ia=TYPE_ORDER.indexOf('AU');TYPE_ORDER.splice(ia<0?TYPE_ORDER.length:ia,0,k);closeModal();toast('Tipo «'+nm+'» agregado · '+money0(r)+' por noche. Ahora agrégale habitaciones.',{icon:'check'});}
        else{TYPES[t].n=nm;TYPES[t].cap=c;TYPES[t].beds=b;TYPES[t].rate=r;closeModal();toast('Tipo «'+nm+'» actualizado',{icon:'check'});}
        render({soft:true});};
      if(!nuevo&&t!=='AU')$('#tpDel',w).onclick=function(){if(n)return err('No se puede eliminar: '+plural(n,'habitación es','habitaciones son')+' de este tipo. Cámbialas de tipo primero.');if(RES.some(function(r){return r.room&&room(r.room)&&room(r.room).t===t;}))return err('Hay reservas con este tipo.');
        TYPE_ORDER.splice(TYPE_ORDER.indexOf(t),1);var nm=TYPES[t].n;delete TYPES[t];closeModal();toast('Tipo «'+nm+'» eliminado',{icon:'trash'});render({soft:true});};
    }});
}
Object.assign(ACT,{
  'hab-add':function(){habModal(null);},
  'hab-edit':function(a){var rm=room(a.dataset.room);if(rm)habModal(rm);},
  'tipo-add':function(){tipoModal(null);},
  'tipo-edit':function(a){tipoModal(a.dataset.t);}
});
/* en el modal de habitación, el campo «Hasta» solo tiene sentido al agregar */
window.NK=window.NK||{};window.NK.rooms=function(){return ROOMS.length;};
window.NK.quitar=function(ns){ns.forEach(function(n){var r=room(n);if(r&&!resDe(n).length)ROOMS.splice(ROOMS.indexOf(r),1);});};

/* ---------- inicio ---------- */
$('#dw').inert=true;
var k0=location.hash.slice(1);
if(k0==='nueva')state.form=newForm();
if(k0)state.view=k0;
render();
entrarRecepcion();
})();
